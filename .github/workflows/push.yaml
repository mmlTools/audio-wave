name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  # Pushes don't build. Builds are started manually (Dispatch workflow), and a release tag
  # publishes the packages from the manual build of the tagged commit.
  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

          plugin_name="$(jq -r '.displayName // .name' buildspec.json)"
          echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT

          # The reused packages carry the buildspec version in their names, so the tag must match it.
          spec_version="$(jq -r '.version' buildspec.json)"
          if grep -q '^validTag=true$' "${GITHUB_OUTPUT}" && [[ "${GITHUB_REF_NAME%%-*}" != "${spec_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match buildspec.json version ${spec_version}."
            exit 1
          fi

      - name: Find Manual Build 🔎
        if: fromJSON(steps.check.outputs.validTag)
        id: build_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Find Manual Build 🔎
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # Newest manual (Dispatch workflow) build of the tagged commit.
          run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow dispatch.yaml --commit "${GITHUB_SHA}" \
            --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"

          if [[ -z "${run_id}" ]]; then
            echo "::error::No manual build found for ${GITHUB_SHA}. Run the Dispatch workflow (job: build) on this commit, then push the tag."
            exit 1
          fi

          echo "Using packages from run ${run_id}"
          # If the manual build is still running, wait for it.
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 30 > /dev/null || {
            echo "::error::Manual build ${run_id} did not succeed, so there are no packages to release."
            exit 1
          }
          echo "runId=${run_id}" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download
        with:
          run-id: ${{ steps.build_run.outputs.runId }}
          github-token: ${{ github.token }}

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ steps.check.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
